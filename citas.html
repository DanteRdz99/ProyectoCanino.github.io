<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reservar Cita - Aventuras Caninas</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
  <header>
    <h1>Reservar Cita</h1>
    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="servicios.html">Servicios</a></li>
        <li><a href="citas.html">Reservar Cita</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>Agenda una cita para tu mascota</h2>
    <form>
      <label for="fecha">Fecha:</label>
      <input type="date" id="fecha" name="fecha" required>

      <label for="hora">Hora:</label>
      <input type="time" id="hora" name="hora" required>

      <label for="direccion">Dirección:</label>
      <input type="text" id="direccion" name="direccion" placeholder="Calle y número" required>

      <label for="municipio">Municipio:</label>
      <input type="text" id="municipio" name="municipio" required>

      <label for="tipo_servicio">Tipo de Servicio:</label>
      <select id="tipo_servicio" name="tipo_servicio" required>
        <option value="paseo">Paseo</option>
        <option value="cuidado">Cuidado</option>
      </select>

      <button type="submit">Reservar Cita</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2025 Aventuras Caninas</p>
  </footer>
  <script src="js/main.js"></script>
</body>
</html>
