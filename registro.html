<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registro - Aventuras Caninas</title>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    .input-group {
      position: relative;
    }

    .input-group input {
      width: 100%;
      padding-right: 40px;
    }

    .input-group .toggle-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 1.1rem;
      color: #888;
    }

    .login-link {
      display: block;
      text-align: center;
      margin-top: 1rem;
      font-size: 0.9rem;
    }

    .login-link a {
      color: var(--color-primary);
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <h1>Crear Cuenta</h1>
    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="servicios.html">Servicios</a></li>
        <li><a href="citas.html">Reservar Cita</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <form>
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>

      <label for="apellido">Apellido:</label>
      <input type="text" id="apellido" name="apellido" placeholder="Tu apellido" required>

      <label for="email">Correo electrónico:</label>
      <input type="email" id="email" name="email" placeholder="ejemplo@email.com" required>

      <label for="password">Contraseña:</label>
      <div class="input-group">
        <input type="password" id="password" name="password" placeholder="Crea una contraseña" required>
        <span class="toggle-password" id="togglePassword">&#128065;</span>
      </div>

      <label for="confirmar">Confirmar Contraseña:</label>
      <div class="input-group">
        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repite la contraseña" required>
        <span class="toggle-password" id="toggleConfirm">&#128065;</span>
      </div>

      <button type="submit" class="btn">Registrarse</button>

      <span class="login-link">
        ¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a>
      </span>
    </form>
  </main>

  <footer>
    <p>&copy; 2025 Aventuras Caninas</p>
  </footer>

  <script>
    const togglePassword = document.querySelector("#togglePassword");
    const toggleConfirm = document.querySelector("#toggleConfirm");
    const passwordInput = document.querySelector("#password");
    const confirmInput = document.querySelector("#confirmPassword");

    togglePassword.addEventListener("click", () => {
      const type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
      passwordInput.setAttribute("type", type);
      togglePassword.textContent = type === "password" ? "👁️" : "🙈";
    });

    toggleConfirm.addEventListener("click", () => {
      const type = confirmInput.getAttribute("type") === "password" ? "text" : "password";
      confirmInput.setAttribute("type", type);
      toggleConfirm.textContent = type === "password" ? "👁️" : "🙈";
    });
  </script>
</body>
</html>
